<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <!-- Tailwind CSS -->
  <script src="https://jsdelivr.net"></script>
  <!-- Dexie.js для IndexedDB -->
  <script src="https://unpkg.com"></script>
  <style>
    body { background-color: #000000; color: #ffffff; }
    .status-badge { color: #ef4444; border: 1px solid #ef4444; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #ef4444; border-radius: 3px; }
  </style>
</head>
<body class="font-sans antialiased custom-scrollbar">

  <!-- Навигация -->
  <nav class="border-b border-zinc-800 bg-zinc-950 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold tracking-wider text-red-500">ANIME.TRACKER</h1>
      
      <!-- Вкладки -->
      <div class="flex gap-2">
        <button id="tab-all" class="px-4 py-2 bg-red-600 text-white rounded font-medium transition hover:bg-red-700">Все</button>
        <button id="tab-fav" class="px-4 py-2 bg-zinc-900 text-zinc-400 rounded font-medium transition hover:bg-zinc-800 border border-zinc-800">★ Избранное</button>
      </div>

      <!-- Кнопки управления базой -->
      <div class="flex flex-wrap gap-2 justify-center">
        <label class="cursor-pointer px-3 py-1.5 bg-zinc-900 text-sm border border-zinc-700 rounded hover:bg-zinc-800 text-center">
          Импорт CSV
          <input type="file" id="csv-file" accept=".csv" class="hidden">
        </label>
        <button id="btn-export" class="px-3 py-1.5 bg-zinc-900 text-sm border border-zinc-700 rounded hover:bg-zinc-800">Экспорт CSV</button>
        <button id="btn-add-modal" class="px-3 py-1.5 bg-red-600 text-sm font-bold rounded hover:bg-red-700">+ Добавить</button>
      </div>
    </div>
  </nav>

  <!-- Панель Фильтров и Поиска -->
  <div class="max-w-6xl mx-auto p-4 flex flex-col md:flex-row gap-4">
    <input type="text" id="search-input" placeholder="Поиск по названию..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded p-2 text-white focus:outline-none focus:border-red-500">
    <select id="filter-status" class="bg-zinc-950 border border-zinc-800 rounded p-2 text-white focus:outline-none focus:border-red-500">
      <option value="Все">Все статусы</option>
      <option value="Смотрю">Смотрю</option>
      <option value="В планах">В планах</option>
      <option value="Просмотренно">Просмотренно</option>
      <option value="Отложено">Отложено</option>
      <option value="Брошено">Брошено</option>
    </select>
  </div>

  <!-- Главный Контент -->
  <main class="max-w-6xl mx-auto p-4">
    <div id="anime-list" class="flex flex-col gap-4">
      <!-- Карточки будут рендериться здесь через JS -->
    </div>
    <div id="empty-state" class="text-center py-12 text-zinc-500 hidden">Ничего не найдено</div>
  </main>

  <!-- Модальное окно добавления/редактирования -->
  <div id="anime-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-zinc-950 border border-zinc-800 p-6 rounded-lg w-full max-w-md max-h-[90vh] overflow-y-auto custom-scrollbar">
      <h3 id="modal-title" class="text-xl font-bold mb-4 text-red-500">Добавить Аниме</h3>
      <form id="anime-form" class="space-y-4">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Русское название *</label>
          <input type="text" id="form-title-ru" required class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Оригинальное название</label>
          <input type="text" id="form-title-orig" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Альтернативные названия</label>
          <input type="text" id="form-title-alt" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Статус просмотра</label>
          <select id="form-status" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
            <option value="Смотрю">Смотрю</option>
            <option value="В планах">В планах</option>
            <option value="Просмотренно">Просмотренно</option>
            <option value="Отложено">Отложено</option>
            <option value="Брошено">Брошено</option>
          </select>
        </div>
        <div id="form-episodes-container">
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Просмотрено серий</label>
          <input type="number" id="form-episodes" min="0" value="0" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Ссылка на просмотр</label>
          <input type="url" id="form-link" placeholder="https://..." class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Постер (URL)</label>
          <input type="text" id="form-poster" placeholder="Оставьте пустым для автопоиска" class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="form-favorite" class="w-4 h-4 accent-red-600">
          <label for="form-favorite" class="text-sm select-none">Добавить в избранное</label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-close-modal" class="px-4 py-2 bg-zinc-900 text-zinc-400 border border-zinc-800 rounded hover:bg-zinc-800">Отмена</button>
          <button type="submit" class="px-4 py-2 bg-red-600 font-bold rounded hover:bg-red-700">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
